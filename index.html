<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟 - Pomodoro Timer</title>
<style>
  :root {
    --bg: #f0f2f5;
    --card: #ffffff;
    --primary: #e94560;
    --text: #2d2d3a;
    --text-dim: #8e8e9a;
    --accent: #e8890c;
    --ring-track: #e2e5ee;
    --border: #e2e4ea;
    --input-bg: #f8f9fc;
    --shadow: 0 2px 16px rgba(0,0,0,0.06);
    --shadow-lg: 0 4px 24px rgba(0,0,0,0.08);
    --quote-bg: linear-gradient(135deg, #fff8f0, #fff5f5);
    --quote-text: #4a4a5a;
    --btn-icon-hover: #f0f0f5;
    --task-active-bg: #fff5f5;
  }
  [data-theme="dark"] {
    --bg: #1a1a2e;
    --card: #16213e;
    --text: #e0e0e8;
    --text-dim: #8a8a9a;
    --ring-track: #1e2a4a;
    --border: #2a3a5c;
    --input-bg: #1a1a3e;
    --shadow: 0 2px 16px rgba(0,0,0,0.35);
    --shadow-lg: 0 4px 24px rgba(0,0,0,0.45);
    --quote-bg: linear-gradient(135deg, #1e1e35, #1a1a30);
    --quote-text: #c0c0d0;
    --btn-icon-hover: #1e3050;
    --task-active-bg: #1e1530;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.4s, color 0.4s;
  }
  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 40px 32px 60px;
    max-width: 420px;
    width: 100%;
    transition: all 0.4s ease;
  }

  /* ----- 主题切换按钮 ----- */
  .theme-toggle {
    position: fixed; top: 16px; right: 16px;
    width: 40px; height: 40px; border-radius: 50%;
    border: none; background: var(--card); color: var(--text);
    font-size: 20px; cursor: pointer; box-shadow: var(--shadow);
    transition: all 0.3s; z-index: 10;
  }
  .theme-toggle:hover { transform: scale(1.1); }

  /* ----- 模式切换标签 ----- */
  .tabs {
    display: flex; gap: 4px;
    background: var(--card); border-radius: 32px;
    padding: 4px; box-shadow: var(--shadow);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .tab {
    padding: 10px 20px; border: none; background: transparent;
    color: var(--text-dim); font-size: 15px; font-weight: 600;
    border-radius: 28px; cursor: pointer; transition: all 0.3s; white-space: nowrap;
  }
  .tab.active { background: var(--primary); color: #fff; }

  /* ----- 当前任务指示 ----- */
  .active-task-indicator {
    font-size: 16px; color: var(--text-dim);
    text-align: center; min-height: 24px;
    transition: all 0.4s ease;
  }
  .active-task-indicator.has-task { color: var(--primary); font-weight: 600; font-size: 18px; }

  /* ----- 圆形计时器 ----- */
  .timer-ring-wrapper {
    position: relative; width: 280px; height: 280px;
    transition: transform 0.4s ease, width 0.4s ease, height 0.4s ease;
  }
  .timer-ring { transform: rotate(-90deg); width: 280px; height: 280px; }
  .ring-bg { fill: none; stroke: var(--ring-track); stroke-width: 10; }
  .ring-progress {
    fill: none; stroke: var(--primary); stroke-width: 10;
    stroke-linecap: round; transition: stroke-dashoffset 0.3s linear;
  }
  .timer-text {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); text-align: center;
  }
  .time-display {
    font-size: 64px; font-weight: 700; letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    font-family: 'SF Mono', 'Menlo', 'Courier New', monospace;
    transition: font-size 0.4s ease;
  }
  .time-label {
    font-size: 14px; color: var(--text-dim);
    margin-top: 4px; letter-spacing: 2px;
  }

  /* ----- 主区域 / 侧边栏 ----- */
  .main { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
  .sidebar {
    width: 100%; display: flex; flex-direction: column; gap: 24px;
    opacity: 1; transition: opacity 0.4s ease, max-height 0.4s ease;
    overflow: hidden; max-height: 2000px;
  }
  .sidebar-section { transition: opacity 0.3s ease; }

  /* ----- 控制按钮 ----- */
  .controls { display: flex; gap: 16px; align-items: center; }
  .btn {
    border: none; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-main {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--primary); color: #fff; font-size: 28px;
    box-shadow: 0 4px 20px rgba(233, 69, 96, 0.3);
    transition: all 0.2s, transform 0.4s ease;
  }
  .btn-main:hover { transform: scale(1.06); box-shadow: 0 6px 28px rgba(233, 69, 96, 0.45); }
  .btn-main:active { transform: scale(0.96); }
  .btn-icon {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--card); color: var(--text); font-size: 20px;
    box-shadow: var(--shadow);
  }
  .btn-icon:hover { background: var(--btn-icon-hover); }

  /* ----- 统计卡片 ----- */
  .stats-row { display: flex; gap: 12px; width: 100%; }
  .stat-card {
    flex: 1; background: var(--card); border-radius: 16px;
    padding: 16px 12px; text-align: center; box-shadow: var(--shadow);
  }
  .stat-value {
    font-size: 28px; font-weight: 700; color: var(--accent);
    font-family: 'SF Mono', 'Menlo', monospace;
  }
  .stat-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; letter-spacing: 1px; }

  /* ----- 任务列表 ----- */
  .task-section {
    width: 100%; background: var(--card);
    border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow);
  }
  .task-section-header { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; letter-spacing: 1px; }
  .task-list { display: flex; flex-direction: column; gap: 4px; }
  .task-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 10px;
    cursor: pointer; transition: all 0.15s; position: relative;
  }
  .task-item:hover { background: var(--btn-icon-hover); }
  .task-item.active { background: var(--task-active-bg); }
  .task-item.active .task-name { font-weight: 700; color: var(--primary); }
  .task-indicator { font-size: 12px; width: 16px; text-align: center; flex-shrink: 0; }
  .task-name { flex: 1; font-size: 14px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-pomos { font-size: 13px; color: var(--accent); font-weight: 600; flex-shrink: 0; }
  .task-delete {
    width: 24px; height: 24px; border-radius: 50%;
    border: none; background: transparent; color: var(--text-dim);
    font-size: 14px; cursor: pointer; opacity: 0;
    transition: all 0.15s; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .task-item:hover .task-delete { opacity: 1; }
  .task-delete:hover { background: var(--primary); color: #fff; }
  .task-input-row { margin-top: 8px; }
  .task-input {
    width: 100%; padding: 10px 14px;
    border: 2px dashed var(--border); border-radius: 10px;
    background: transparent; color: var(--text);
    font-size: 14px; outline: none; transition: border-color 0.2s;
  }
  .task-input:focus { border-color: var(--primary); border-style: solid; }
  .task-input::placeholder { color: var(--text-dim); opacity: 0.6; }
  .task-empty { text-align: center; padding: 12px 0; font-size: 13px; color: var(--text-dim); opacity: 0.5; }

  /* ----- 励志语录 ----- */
  .quote-card {
    width: 100%; background: var(--quote-bg);
    border-left: 4px solid var(--primary);
    border-radius: 12px; padding: 16px 18px;
    box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .quote-icon { position: absolute; top: 8px; right: 12px; font-size: 28px; opacity: 0.15; }
  .quote-text { font-size: 14px; line-height: 1.6; color: var(--quote-text); font-style: italic; padding-right: 24px; }
  .quote-author { font-size: 12px; color: var(--text-dim); margin-top: 6px; }

  /* ----- 设置面板 ----- */
  .settings-panel {
    background: var(--card); border-radius: 16px;
    padding: 20px; width: 100%; display: flex;
    flex-direction: column; gap: 14px; box-shadow: var(--shadow);
  }
  .setting-row { display: flex; justify-content: space-between; align-items: center; }
  .setting-label { font-size: 14px; color: var(--text-dim); }
  .setting-input {
    width: 72px; padding: 8px 10px;
    border: 2px solid var(--border); border-radius: 10px;
    background: var(--input-bg); color: var(--text);
    font-size: 15px; text-align: center; font-family: 'SF Mono', 'Menlo', monospace;
  }
  .setting-input:focus { outline: none; border-color: var(--primary); }
  .setting-unit { font-size: 13px; color: var(--text-dim); margin-left: 6px; }
  .theme-select {
    padding: 6px 10px; border: 2px solid var(--border);
    border-radius: 10px; background: var(--input-bg);
    color: var(--text); font-size: 14px; cursor: pointer;
  }
  .theme-select:focus { outline: none; border-color: var(--primary); }

  /* ============ 专注模式 ============ */
  .app.focus-mode {
    gap: 20px; padding-top: 60px;
  }
  .app.focus-mode .sidebar {
    opacity: 0; max-height: 0; pointer-events: none;
  }
  .app.focus-mode .tabs {
    opacity: 0; pointer-events: none;
  }
  .app.focus-mode .timer-ring-wrapper {
    transform: scale(1.1);
  }
  .app.focus-mode .time-display {
    font-size: 74px;
  }
  .app.focus-mode .active-task-indicator {
    font-size: 22px; margin-top: 4px;
  }
  .app.focus-mode .active-task-indicator.has-task {
    font-size: 24px;
  }
  .app.focus-mode .btn-icon {
    display: none;
  }
  .app.focus-mode .btn-main {
    transform: scale(1.2);
  }

  /* 休息模式 */
  .app.break-mode {
    gap: 20px; padding-top: 60px;
  }
  .app.break-mode .sidebar {
    opacity: 0; max-height: 0; pointer-events: none;
  }
  .app.break-mode .tabs {
    opacity: 1; pointer-events: auto;
  }
  .app.break-mode .time-display {
    font-size: 68px;
  }
  .app.break-mode .btn-icon {
    display: none;
  }

  /* ----- 通知横幅 ----- */
  .toast {
    position: fixed; top: 24px; left: 50%;
    transform: translateX(-50%);
    background: var(--card); color: var(--text);
    padding: 12px 28px; border-radius: 12px;
    font-weight: 700; font-size: 15px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s; z-index: 100;
    box-shadow: var(--shadow-lg);
  }
  .toast.show { opacity: 1; }

  @media (max-width: 400px) {
    .timer-ring-wrapper, .timer-ring { width: 240px; height: 240px; }
    .time-display { font-size: 52px; }
    .app.focus-mode .time-display { font-size: 60px; }
    .tab { padding: 8px 14px; font-size: 13px; }
    .theme-toggle { top: 10px; right: 10px; width: 36px; height: 36px; font-size: 18px; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" onclick="cycleTheme()" title="切换主题">🌓</button>

<div class="app idle-mode" id="appRoot">

  <!-- ===== 主区域（专注时保留） ===== -->
  <div class="main">

    <div class="tabs" id="modeTabs">
      <button class="tab active" data-mode="work" onclick="switchMode('work')">🍅 专注</button>
      <button class="tab" data-mode="shortbreak" onclick="switchMode('shortbreak')">☕ 短休</button>
      <button class="tab" data-mode="longbreak" onclick="switchMode('longbreak')">🌴 长休</button>
    </div>

    <div class="active-task-indicator" id="activeTaskIndicator"></div>

    <div class="timer-ring-wrapper">
      <svg class="timer-ring" viewBox="0 0 280 280">
        <circle class="ring-bg" cx="140" cy="140" r="130"/>
        <circle class="ring-progress" id="ringProgress" cx="140" cy="140" r="130"
                stroke-dasharray="816.8" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-text">
        <div class="time-display" id="timeDisplay">25:00</div>
        <div class="time-label" id="timeLabel">专注中</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-icon" onclick="resetTimer()" title="重置">↺</button>
      <button class="btn btn-main" id="btnStart" onclick="toggleTimer()" title="开始">▶</button>
      <button class="btn btn-icon" onclick="skipTimer()" title="跳过">⏭</button>
    </div>

  </div>

  <!-- ===== 侧边栏（专注时收起） ===== -->
  <div class="sidebar">

    <div class="sidebar-section">
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-value" id="sessionCount">0</div>
          <div class="stat-label">今日番茄</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="dailyTotal">0h 0m</div>
          <div class="stat-label">今日累计</div>
        </div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="task-section">
        <div class="task-section-header">📋 任务列表</div>
        <div class="task-list" id="taskList"></div>
        <div class="task-input-row">
          <input class="task-input" id="taskInput" placeholder="+ 添加任务..." maxlength="40" autocomplete="off">
        </div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="quote-card" id="quoteCard">
        <div class="quote-icon">💡</div>
        <div class="quote-text" id="quoteText"></div>
        <div class="quote-author" id="quoteAuthor"></div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="settings-panel">
        <div class="setting-row">
          <span class="setting-label">🍅 专注时长</span>
          <div>
            <input class="setting-input" id="settingWork" type="number" min="1" max="90" value="25" onchange="updateSettings()">
            <span class="setting-unit">分钟</span>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">☕ 短休时长</span>
          <div>
            <input class="setting-input" id="settingShortBreak" type="number" min="1" max="30" value="5" onchange="updateSettings()">
            <span class="setting-unit">分钟</span>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">🌴 长休时长</span>
          <div>
            <input class="setting-input" id="settingLongBreak" type="number" min="1" max="60" value="15" onchange="updateSettings()">
            <span class="setting-unit">分钟</span>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">🌓 主题</span>
          <div>
            <select class="theme-select" id="settingTheme" onchange="updateSettings()">
              <option value="light">☀️ 浅色</option>
              <option value="dark">🌙 深色</option>
              <option value="auto">🔄 跟随系统</option>
            </select>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">🔔 音效通知</span>
          <div>
            <input class="setting-input" id="settingSound" type="checkbox" checked onchange="updateSettings()" style="width:auto;accent-color:var(--primary);transform:scale(1.3)">
          </div>
        </div>
      </div>
    </div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const CIRCUMFERENCE = 2 * Math.PI * 130;

let state = {
  mode: 'work',
  settings: { work: 25, shortBreak: 5, longBreak: 15, sound: true, theme: 'auto' },
  running: false,
  timeLeft: 25 * 60,
  totalSeconds: 25 * 60,
  intervalId: null,
  daily: { date: '', totalSeconds: 0, sessions: 0 },
  tasks: [],
  activeTaskId: null,
  appMode: 'idle', // 'idle' | 'focus' | 'break'
};

const $appRoot = document.getElementById('appRoot');
const $timeDisplay = document.getElementById('timeDisplay');
const $timeLabel = document.getElementById('timeLabel');
const $ringProgress = document.getElementById('ringProgress');
const $btnStart = document.getElementById('btnStart');
const $sessionCount = document.getElementById('sessionCount');
const $dailyTotal = document.getElementById('dailyTotal');
const $toast = document.getElementById('toast');
const $quoteText = document.getElementById('quoteText');
const $quoteAuthor = document.getElementById('quoteAuthor');
const $themeToggle = document.getElementById('themeToggle');
const $taskList = document.getElementById('taskList');
const $taskInput = document.getElementById('taskInput');
const $activeTaskIndicator = document.getElementById('activeTaskIndicator');

// ============ App Mode 切换 ============
function setAppMode(newMode) {
  state.appMode = newMode;
  $appRoot.className = `app ${newMode}-mode`;
}

// ============ 主题 ============
const THEME_ICONS = { light: '☀️', dark: '🌙', auto: '🌓' };
const THEME_NEXT = { light: 'dark', dark: 'auto', auto: 'light' };
function applyTheme(theme) {
  if (theme === 'auto') {
    document.documentElement.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } else {
    document.documentElement.setAttribute('data-theme', theme);
  }
  $themeToggle.textContent = THEME_ICONS[theme];
}
function cycleTheme() {
  const next = THEME_NEXT[state.settings.theme];
  state.settings.theme = next;
  saveSettings();
  applyTheme(next);
  document.getElementById('settingTheme').value = next;
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (state.settings.theme === 'auto') applyTheme('auto');
});

// ============ 任务管理 ============
function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function loadTasks() {
  try {
    const r = localStorage.getItem('pomodoro_tasks');
    if (r) { const data = JSON.parse(r); state.tasks = data.tasks || []; state.activeTaskId = data.activeTaskId || null; }
  } catch(_) { state.tasks = []; state.activeTaskId = null; }
}
function saveTasks() {
  localStorage.setItem('pomodoro_tasks', JSON.stringify({ tasks: state.tasks, activeTaskId: state.activeTaskId }));
}
function getActiveTask() { return state.tasks.find(t => t.id === state.activeTaskId) || null; }
function renderTasks() {
  $taskList.innerHTML = '';
  if (state.tasks.length === 0) {
    $taskList.innerHTML = '<div class="task-empty">还没有任务，添加一个开始专注吧</div>';
  } else {
    state.tasks.forEach(t => {
      const isActive = t.id === state.activeTaskId;
      const el = document.createElement('div');
      el.className = 'task-item' + (isActive ? ' active' : '');
      el.innerHTML = `<span class="task-indicator">${isActive ? '▶' : ''}</span><span class="task-name">${escapeHtml(t.name)}</span><span class="task-pomos">🍅×${t.pomodoros}</span><button class="task-delete" title="删除任务">✕</button>`;
      el.addEventListener('click', (e) => { if (!e.target.closest('.task-delete')) switchTask(t.id); });
      el.querySelector('.task-delete').addEventListener('click', (e) => { e.stopPropagation(); deleteTask(t.id); });
      $taskList.appendChild(el);
    });
  }
  updateActiveTaskIndicator();
}
function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
function updateActiveTaskIndicator() {
  const task = getActiveTask();
  if (task) { $activeTaskIndicator.textContent = `🎯 ${task.name}`; $activeTaskIndicator.className = 'active-task-indicator has-task'; }
  else { $activeTaskIndicator.textContent = '选择任务开始专注'; $activeTaskIndicator.className = 'active-task-indicator'; }
}
function addTask(name) {
  const trimmed = name.trim();
  if (!trimmed) return;
  if (state.tasks.some(t => t.name === trimmed)) { showToast('任务已存在'); return; }
  const task = { id: generateId(), name: trimmed, pomodoros: 0, createdAt: Date.now() };
  state.tasks.push(task); state.activeTaskId = task.id;
  saveTasks(); renderTasks();
}
function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  if (state.activeTaskId === id) state.activeTaskId = state.tasks.length > 0 ? state.tasks[0].id : null;
  saveTasks(); renderTasks();
}
function switchTask(id) {
  if (state.activeTaskId === id) return;
  state.activeTaskId = id; saveTasks(); renderTasks();
}

// ============ 初始化 ============
function init() {
  loadSettings(); applyTheme(state.settings.theme);
  loadDaily(); loadTasks(); renderTasks();
  document.getElementById('settingWork').value = state.settings.work;
  document.getElementById('settingShortBreak').value = state.settings.shortBreak;
  document.getElementById('settingLongBreak').value = state.settings.longBreak;
  document.getElementById('settingSound').checked = state.settings.sound;
  document.getElementById('settingTheme').value = state.settings.theme;

  const restored = restoreTimerState();
  if (restored) {
    updateDisplay(); updateRing(); updateModeUI(); updateStartButton();
    startTimer(); // 内部会设置 appMode
    showToast('🔄 已恢复上次计时');
  } else {
    state.timeLeft = getModeSeconds(); state.totalSeconds = state.timeLeft;
    updateDisplay(); updateRing(); updateStats(); updateQuote(); updateModeUI();
    setAppMode('idle');
  }

  if (state.timeLeft <= 0 && restored === false) {
    const raw = localStorage.getItem('pomodoro_timer_state');
    if (raw) {
      try {
        const data = JSON.parse(raw);
        state.mode = data.mode; state.totalSeconds = data.totalSeconds; state.timeLeft = 0;
        clearTimerState(); onTimerComplete();
      } catch(_) {}
    }
  }
}

// ============ 计时状态持久化 ============
function saveTimerState() {
  localStorage.setItem('pomodoro_timer_state', JSON.stringify({
    mode: state.mode, totalSeconds: state.totalSeconds,
    isRunning: state.running, timeLeft: state.timeLeft, savedAt: Date.now(),
    settingsWork: state.settings.work, settingsShortBreak: state.settings.shortBreak, settingsLongBreak: state.settings.longBreak,
  }));
}
function restoreTimerState() {
  try {
    const raw = localStorage.getItem('pomodoro_timer_state');
    if (!raw) return false;
    const data = JSON.parse(raw);
    state.mode = data.mode; state.totalSeconds = data.totalSeconds;
    if (data.settingsWork) state.settings.work = data.settingsWork;
    if (data.settingsShortBreak) state.settings.shortBreak = data.settingsShortBreak;
    if (data.settingsLongBreak) state.settings.longBreak = data.settingsLongBreak;
    if (data.isRunning) {
      const elapsed = Math.floor((Date.now() - data.savedAt) / 1000);
      state.timeLeft = Math.max(0, data.totalSeconds - elapsed);
      state.running = false; return state.timeLeft > 0;
    } else { state.timeLeft = data.timeLeft; state.running = false; return false; }
  } catch(_) { return false; }
}
function clearTimerState() { localStorage.removeItem('pomodoro_timer_state'); }

// ============ 设置 ============
function loadSettings() {
  try { const r = localStorage.getItem('pomodoro_settings'); if (r) Object.assign(state.settings, JSON.parse(r)); } catch(_) {}
}
function saveSettings() { localStorage.setItem('pomodoro_settings', JSON.stringify(state.settings)); }
function updateSettings() {
  state.settings.work = parseInt(document.getElementById('settingWork').value) || 25;
  state.settings.shortBreak = parseInt(document.getElementById('settingShortBreak').value) || 5;
  state.settings.longBreak = parseInt(document.getElementById('settingLongBreak').value) || 15;
  state.settings.sound = document.getElementById('settingSound').checked;
  state.settings.theme = document.getElementById('settingTheme').value;
  saveSettings(); applyTheme(state.settings.theme);
  if (!state.running) resetTimer();
}

// ============ 每日统计 ============
function getTodayKey() {
  const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function loadDaily() {
  try {
    const r = localStorage.getItem('pomodoro_daily');
    if (r) { const d = JSON.parse(r); state.daily = d.date === getTodayKey() ? d : { date: getTodayKey(), totalSeconds: 0, sessions: 0 }; }
    else state.daily = { date: getTodayKey(), totalSeconds: 0, sessions: 0 };
  } catch(_) { state.daily = { date: getTodayKey(), totalSeconds: 0, sessions: 0 }; }
}
function saveDaily() { localStorage.setItem('pomodoro_daily', JSON.stringify(state.daily)); }
function addCompletedSession() {
  if (state.mode === 'work') { state.daily.totalSeconds += state.settings.work * 60; state.daily.sessions += 1; saveDaily(); }
}

// ============ 模式切换 ============
function switchMode(mode) {
  if (state.mode === mode) return;
  stopTimer(); state.mode = mode;
  state.timeLeft = getModeSeconds(); state.totalSeconds = state.timeLeft; state.running = false;
  clearTimerState(); setAppMode('idle');
  updateDisplay(); updateRing(); updateModeUI(); updateStartButton();
}
function getModeSeconds() {
  switch (state.mode) { case 'work': return state.settings.work * 60; case 'shortbreak': return state.settings.shortBreak * 60; case 'longbreak': return state.settings.longBreak * 60; default: return state.settings.work * 60; }
}
function updateModeUI() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === state.mode));
  const colors = { work: '#e94560', shortbreak: '#4a90d9', longbreak: '#4a90d9' };
  const labels = { work: '专注中', shortbreak: '短休中', longbreak: '长休中' };
  document.documentElement.style.setProperty('--primary', colors[state.mode]);
  $ringProgress.style.stroke = colors[state.mode];
  $timeLabel.textContent = labels[state.mode];
  $btnStart.style.background = colors[state.mode];
  $btnStart.style.boxShadow = `0 4px 20px ${colors[state.mode]}4d`;
}

// ============ 计时器 ============
function toggleTimer() { state.running ? pauseTimer() : startTimer(); }
function startTimer() {
  if (state.timeLeft <= 0) resetTimer();
  state.running = true; updateStartButton();
  saveTimerState();
  // 根据计时模式设置 app 状态
  if (state.mode === 'work') setAppMode('focus');
  else setAppMode('break');
  state.intervalId = setInterval(tick, 1000);
}
function pauseTimer() {
  state.running = false; clearInterval(state.intervalId); state.intervalId = null;
  saveTimerState(); setAppMode('idle'); updateStartButton();
}
function stopTimer() { clearInterval(state.intervalId); state.intervalId = null; state.running = false; }
function resetTimer() {
  stopTimer(); state.timeLeft = getModeSeconds(); state.totalSeconds = state.timeLeft;
  clearTimerState(); setAppMode('idle');
  updateDisplay(); updateRing(); updateStartButton();
}
function skipTimer() { stopTimer(); clearTimerState(); onTimerComplete(); }

function tick() {
  if (state.timeLeft > 0) {
    state.timeLeft--;
    updateDisplay(); updateRing();
    const m = Math.floor(state.timeLeft / 60), s = state.timeLeft % 60;
    document.title = `${state.mode==='work'?'🍅':'☕'} ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} - 番茄钟`;
    if (state.timeLeft % 10 === 0) saveTimerState();
  } else { stopTimer(); clearTimerState(); onTimerComplete(); }
}

function onTimerComplete() {
  let taskMsg = '';
  if (state.mode === 'work') {
    const task = getActiveTask();
    if (task) { task.pomodoros += 1; saveTasks(); renderTasks(); taskMsg = `「${task.name}」累计 🍅×${task.pomodoros}`; }
  }
  addCompletedSession(); updateStats();
  if (state.settings.sound) playBeepSound();

  const mainMsg = state.mode === 'work'
    ? (taskMsg ? `🍅 ${taskMsg}` : '🍅 专注完成！休息一下吧~')
    : '⏰ 休息结束，继续加油！';
  showToast(mainMsg);
  document.title = state.mode === 'work' ? '🍅 时间到！' : '⏰ 休息结束！';

  if (Notification.permission === 'granted') {
    const quote = getDailyQuote();
    const body = state.mode === 'work'
      ? (taskMsg ? `${taskMsg}\n${quote.text} —${quote.author}` : `专注完成！${quote.text} —${quote.author}`)
      : '休息结束，开始新的番茄！';
    new Notification('番茄钟', { body, icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🍅</text></svg>' });
  }

  // 完成后回到 idle，让用户看到侧边栏
  setAppMode('idle');
  state.timeLeft = getModeSeconds(); state.totalSeconds = state.timeLeft;
  updateDisplay(); updateRing(); updateStartButton();
}

// ============ 音效 ============
function playBeepSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.4);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + i * 0.15); o.stop(ctx.currentTime + i * 0.15 + 0.4);
    });
  } catch(_) {}
}

// ============ Toast ============
function showToast(msg) { $toast.textContent = msg; $toast.classList.add('show'); setTimeout(() => $toast.classList.remove('show'), 2500); }

// ============ 显示 ============
function updateDisplay() {
  const m = Math.floor(state.timeLeft / 60), s = state.timeLeft % 60;
  $timeDisplay.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function updateRing() { $ringProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - state.timeLeft / state.totalSeconds); }
function updateStartButton() { $btnStart.textContent = state.running ? '⏸' : '▶'; }
function updateStats() {
  $sessionCount.textContent = state.daily.sessions;
  const totalMin = Math.floor(state.daily.totalSeconds / 60);
  $dailyTotal.textContent = `${Math.floor(totalMin/60)}h ${totalMin%60}m`;
}

function getDayOfYear() {
  const now = new Date(); const start = new Date(now.getFullYear(), 0, 0);
  return Math.floor((now - start) / (1000 * 60 * 60 * 24));
}
function getDailyQuote() { return QUOTES[getDayOfYear() % QUOTES.length]; }
function updateQuote() {
  const q = getDailyQuote();
  $quoteText.textContent = `"${q.text}"`; $quoteAuthor.textContent = `— ${q.author}`;
}

// ============ 任务输入监听 ============
$taskInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { addTask($taskInput.value); $taskInput.value = ''; }
});

// ============ 键盘快捷键 ============
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  switch(e.code) {
    case 'Space': e.preventDefault(); toggleTimer(); break;
    case 'KeyR': resetTimer(); break;
    case 'KeyS': skipTimer(); break;
    case 'Digit1': switchMode('work'); break;
    case 'Digit2': switchMode('shortbreak'); break;
    case 'Digit3': switchMode('longbreak'); break;
  }
});

// ============ 通知权限 ============
if ('Notification' in window && Notification.permission === 'default') {
  setTimeout(() => Notification.requestPermission(), 3000);
}

// ============ 启动 ============
init();
updateModeUI();
document.title = '🍅 番茄钟';
